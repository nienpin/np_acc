<!DOCTYPE html>
<html lang="zh-TW">

<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">

<title>NP 記帳程式 V3.0</title>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

<style>

body{
    background:#1e1e1e;
    color:white;
    font-family:Consolas,"Microsoft JhengHei";
    margin:20px;
}

h1{
    color:#4CAF50;
}

input,select{
    background:#333;
    color:white;
    border:1px solid #666;
    padding:8px;
    margin:5px;
}

button{
    background:#4CAF50;
    color:white;
    border:none;
    padding:8px 15px;
    margin:5px;
    cursor:pointer;
}

button:hover{
    opacity:0.9;
}

table{
    width:100%;
    border-collapse:collapse;
    margin-top:15px;
}

th,td{
    border:1px solid #555;
    padding:8px;
    text-align:center;
}

th{
    background:#333;
}

.summary{
    margin-top:20px;
    background:#2a2a2a;
    padding:15px;
    border-radius:10px;
}

.currency-box{
    margin-top:10px;
    padding:8px;
    background:#333;
    border-radius:5px;
}

</style>

</head>

<body>

<h1>💰 NP 記帳程式 V3.0</h1>

<input type="date" id="date">

<select id="person">

    <option>王微明</option>
    <option>王小明</option>
    <option>王中明</option>
    <option>王大明</option>
    <option>王巨明</option>

</select>

<input
type="text"
id="item"
placeholder="項目">

<select id="currency">

<option>EUR</option>
<option>TWD</option>
<option>USD</option>
<option>SGD</option>
<option>JPY</option>
<option>CNY</option>

</select>

<input
type="number"
step="0.01"
id="amount"
placeholder="金額">

<select id="paymentType">

<option>現金</option>
<option>刷卡</option>

</select>

<label>

<input
type="checkbox"
id="receipt">

有單據

</label>

<button onclick="addRecord()">
新增
</button>

<button onclick="exportCSV()">
匯出 CSV
</button>

<input
type="text"
id="search"
placeholder="搜尋項目..."
onkeyup="render()">

<table>

<thead>

<tr>
<th>日期</th>
<th>人員</th>
<th>項目</th>
<th>貨幣</th>
<th>金額</th>
<th>付款方式</th>
<th>單據</th>
</tr>

</thead>

<tbody id="tbody">
</tbody>

</table>

<div class="summary">

<h3>統計資訊</h3>

<div id="count"></div>

<div id="currencySummary"></div>

</div>

<script>

    const SUPABASE_URL =
"https://bzngbizeuoaxuanscnbm.supabase.co";

const SUPABASE_KEY =
"sb_publishable_WX5-QmrBD7VYCM_sMzBR7g_E83hfgM1";

const supabaseClient =
window.supabase.createClient(
    SUPABASE_URL,
    SUPABASE_KEY
);

let records = [];

async function loadData(){

    const { data, error } =
    await supabaseClient
    .from("np_acc")
    .select("*")
    .order("id",{ascending:true});

    if(error){

        console.error(error);

        return;

    }

    records = data || [];

    render();

}

async function addRecord(){

    let date =
    document.getElementById("date").value;

    let item =
    document.getElementById("item").value;

    let amount =
    parseFloat(
        document
        .getElementById("amount")
        .value
    );

    if(
        !date ||
        !item ||
        !amount
    ){
        alert("請完整輸入資料");
        return;
    }

    const { error } =
    await supabaseClient
    .from("np_acc")
    .insert([{

        date:date,

        person:
        document
        .getElementById("person")
        .value,

        item:item,

        currency:
        document
        .getElementById("currency")
        .value,

        amount:amount,

        payment_type:
        document
        .getElementById("paymentType")
        .value,

        receipt:
        document
        .getElementById("receipt")
        .checked

    }]);

    if(error){

        console.error(error);

        alert(error.message);

        return;

    }

    document.getElementById("item").value="";
    document.getElementById("amount").value="";
    document.getElementById("receipt").checked=false;

    await loadData();

}

function render(){

    let tbody =
    document.getElementById("tbody");

    tbody.innerHTML="";

    let searchText =
    document
    .getElementById("search")
    .value
    .toLowerCase();

    let currencyTotals = {};

    records.forEach(r=>{

        if(
            searchText &&
            !r.item
            .toLowerCase()
            .includes(searchText)
        ){
            return;
        }

        if(!currencyTotals[r.currency]){

            currencyTotals[r.currency]=0;

        }

        currencyTotals[r.currency]+=
        Number(r.amount);

        tbody.innerHTML += `

        <tr>

        <td>${r.date}</td>

        <td>${r.person}</td>

        <td>${r.item}</td>

        <td>${r.currency}</td>

        <td>${Number(r.amount).toLocaleString(
            undefined,
            {
                minimumFractionDigits:2,
                maximumFractionDigits:2
            }
        )}</td>

        <td>${r.payment_type}</td>

        <td>
            ${r.receipt ? "✅":"❌"}
        </td>

        </tr>

        `;

    });

    document.getElementById("count").innerHTML =
    `總筆數：${records.length}`;

    let html="";

    for(let currency in currencyTotals){

        html += `

        <div class="currency-box">

        <strong>${currency}</strong>

        ：${currencyTotals[currency].toLocaleString(
        undefined,
        {
            minimumFractionDigits:2,
            maximumFractionDigits:2
        }
        )}

        </div>

        `;

    }

    document
    .getElementById("currencySummary")
    .innerHTML = html;

}

function exportCSV(){

    let csv =
    "日期,人員,項目,貨幣,金額,付款方式,有單據\n";

    records.forEach(r=>{

        csv +=
`${r.date},${r.item},${r.currency},${r.amount},${r.payment_type},${r.receipt ? "是":"否"}\n`;

    });

    const blob =
    new Blob(
        ['\uFEFF' + csv],
        {
            type:
            "text/csv;charset=utf-8;"
        }
    );

    const link =
    document.createElement("a");

    link.href =
    URL.createObjectURL(blob);

    link.download =
    "expense_report.csv";

    link.click();

}

document.getElementById("date").value =
new Date().toISOString().split("T")[0];

loadData();

</script>

</body>
</html>
